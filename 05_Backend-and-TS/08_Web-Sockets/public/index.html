<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>1 Million Checkboxes</title>
    <style>
      :root {
        --primary-bg: #1a0b2e;
        --secondary-bg: #2d1b3d;
        --tertiary-bg: #4a2c5a;
        --accent-color: #ff8c42;
        --accent-dark: #e67e22;
        --accent-glow: #ffb366;
        --text-color: #f8f4f0;
        --glass-bg: rgba(255, 255, 255, 0.06);
        --glass-border: rgba(255, 215, 0, 0.2);
        --checkbox-bg: linear-gradient(145deg, #3d2b4a, #2a1f35);
        --checkbox-checked: linear-gradient(145deg, #ff8c42, #e67e22);
        --shadow-color: rgba(255, 140, 66, 0.3);
      }

      * {
        box-sizing: border-box;
      }

      body {
        background:
          radial-gradient(
            ellipse at top,
            var(--primary-bg) 0%,
            transparent 50%
          ),
          radial-gradient(
            ellipse at bottom,
            var(--tertiary-bg) 0%,
            transparent 50%
          ),
          linear-gradient(
            135deg,
            var(--primary-bg) 0%,
            var(--secondary-bg) 100%
          );
        color: var(--text-color);
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        margin: 0;
        padding: 0;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        position: relative;
      }

      body::before {
        content: "";
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background:
          radial-gradient(
            circle at 25% 25%,
            rgba(255, 140, 66, 0.1) 0%,
            transparent 50%
          ),
          radial-gradient(
            circle at 75% 75%,
            rgba(255, 215, 102, 0.08) 0%,
            transparent 50%
          );
        pointer-events: none;
      }

      h1 {
        font-size: 4.5rem;
        font-weight: 700;
        text-align: center;
        margin-bottom: 3.5rem;
        background: linear-gradient(45deg, #ff8c42, #ffb366, #ff6b35, #f7931e);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        letter-spacing: 3px;
        text-shadow: 0 0 30px rgba(255, 140, 66, 0.4);
        position: relative;
        z-index: 2;
      }

      #container {
        position: relative;
        width: 100%;
        max-width: 1100px;
        height: 80vh;
        overflow-y: auto;
        background: var(--glass-bg);
        border-radius: 35px;
        backdrop-filter: blur(25px);
        border: 2px solid var(--glass-border);
        box-shadow:
          0 20px 60px rgba(0, 0, 0, 0.5),
          0 0 80px rgba(255, 140, 66, 0.1),
          inset 0 2px 0 rgba(255, 255, 255, 0.1);
        z-index: 2;
      }

      input[type="checkbox"] {
        appearance: none;
        width: 55px;
        height: 55px;
        background: var(--checkbox-bg);
        border: 3px solid #5a4a6a;
        border-radius: 18px;
        cursor: pointer;
        transition: all 0.2s ease;
        position: relative;
        box-shadow:
          0 6px 18px rgba(0, 0, 0, 0.6),
          inset 0 2px 0 rgba(255, 255, 255, 0.1),
          inset 0 -2px 0 rgba(0, 0, 0, 0.2);
      }

      input[type="checkbox"]:hover {
        transform: scale(1.08);
        box-shadow:
          0 8px 24px rgba(0, 0, 0, 0.7),
          0 0 30px var(--shadow-color),
          inset 0 2px 0 rgba(255, 255, 255, 0.15),
          inset 0 -2px 0 rgba(0, 0, 0, 0.3);
        border-color: #7a6a8a;
      }

      input[type="checkbox"]:checked {
        background: var(--checkbox-checked);
        border-color: var(--accent-color);
        box-shadow:
          0 6px 18px rgba(0, 0, 0, 0.6),
          0 0 40px var(--shadow-color),
          inset 0 2px 0 rgba(255, 255, 255, 0.2);
      }

      input[type="checkbox"]:checked::after {
        content: "✓";
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        color: #2a1f35;
        font-size: 32px;
        font-weight: 900;
        text-shadow: 0 0 12px rgba(255, 255, 255, 0.8);
        filter: drop-shadow(0 2px 4px rgba(0, 0, 0, 0.5));
      }

      @media (max-width: 768px) {
        h1 {
          font-size: 3.5rem;
          margin-bottom: 2.5rem;
          letter-spacing: 2px;
        }
        #container {
          padding: 2.5rem;
          gap: 15px;
          max-width: 95vw;
          border-radius: 28px;
        }
        input[type="checkbox"] {
          width: 50px;
          height: 50px;
        }
      }

      #error-alert {
        position: fixed;
        top: 20px;
        right: 20px;
        background: linear-gradient(135deg, #d32f2f, #b71c1c);
        color: #ffffff;
        padding: 18px 28px;
        border-radius: 12px;
        box-shadow:
          0 8px 24px rgba(211, 47, 47, 0.4),
          0 0 40px rgba(211, 47, 47, 0.2);
        font-size: 15px;
        font-weight: 700;
        display: none;
        z-index: 9999;
        border: 2px solid #ff5252;
        animation: slideIn 0.3s ease-out;
        max-width: 300px;
      }

      #error-alert.show {
        display: block;
      }

      #error-alert .error-message {
        margin-bottom: 6px;
        letter-spacing: 0.5px;
      }

      #error-alert .countdown {
        font-size: 13px;
        font-weight: 600;
        color: #ffcdd2;
        opacity: 0.9;
      }

      #container.rate-limited input[type="checkbox"] {
        pointer-events: none;
        opacity: 0.6;
      }

      @keyframes slideIn {
        from {
          transform: translateX(400px);
          opacity: 0;
        }
        to {
          transform: translateX(0);
          opacity: 1;
        }
      }

      @media (max-width: 480px) {
        h1 {
          font-size: 2.8rem;
          letter-spacing: 1px;
        }
        #container {
          padding: 2rem;
          gap: 12px;
          border-radius: 24px;
        }
        input[type="checkbox"] {
          width: 45px;
          height: 45px;
        }
        #error-alert {
          top: 10px;
          right: 10px;
          left: 10px;
          max-width: calc(100vw - 20px);
        }
      }
    </style>
  </head>
  <body style="padding-top: 56px">
    <nav
      style="
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        height: 56px;
        background: rgba(45, 27, 61, 0.9);
        backdrop-filter: blur(16px);
        border-bottom: 1px solid rgba(255, 215, 0, 0.15);
        display: flex;
        align-items: center;
        justify-content: flex-end;
        padding: 0 24px;
        z-index: 1000;
      "
    >
      <a
        href="/api/auth/signin"
        id="btn-login"
        style="
          display: inline-flex;
          align-items: center;
          gap: 8px;
          padding: 8px 20px;
          border: none;
          border-radius: 10px;
          font-size: 0.85rem;
          font-weight: 600;
          color: #fff;
          background: linear-gradient(135deg, #ff8c42, #e67e22);
          cursor: pointer;
          text-decoration: none;
          box-shadow: 0 0 16px rgba(255, 140, 66, 0.4);
        "
      >
        Login / Sign Up
      </a>
    </nav>
    <div id="error-alert"></div>
    <h1>1 Million CheckBoxes</h1>
    <div id="container"></div>
    <script src="/socket.io/socket.io.js"></script>
    <script>
      const socket = io();
      const container = document.getElementById("container");

      const TOTAL = 1_000_000;
      const CB_SIZE = 28;
      const CB_GAP = 6;
      const CB_FULL = CB_SIZE + CB_GAP;
      const BUFFER_ROWS = 5;

      let COLS = 1;
      let ROW_HEIGHT = CB_FULL;
      let state = new Array(TOTAL).fill(false);
      let isLoggedIn = false;
      let isRateLimited = false;

      const inner = document.createElement("div");
      inner.style.cssText = "position:relative;width:100%;";
      container.appendChild(inner);

      function recalcCols() {
        COLS = Math.max(1, Math.floor((container.clientWidth - 32) / CB_FULL));
        ROW_HEIGHT = CB_FULL;
        const totalRows = Math.ceil(TOTAL / COLS);
        inner.style.height = `${totalRows * ROW_HEIGHT}px`;
      }

      const visible = new Map();

      function render() {
        const scrollTop = container.scrollTop;
        const viewH = container.clientHeight;
        const startRow = Math.max(
          0,
          Math.floor(scrollTop / ROW_HEIGHT) - BUFFER_ROWS,
        );
        const endRow =
          Math.ceil((scrollTop + viewH) / ROW_HEIGHT) + BUFFER_ROWS;
        const startIdx = startRow * COLS;
        const endIdx = Math.min(TOTAL - 1, endRow * COLS - 1);

        for (const [idx, el] of visible) {
          if (idx < startIdx || idx > endIdx) {
            el.remove();
            visible.delete(idx);
          }
        }

        for (let i = startIdx; i <= endIdx; i++) {
          if (visible.has(i)) {
            visible.get(i).checked = state[i];
            continue;
          }

          const row = Math.floor(i / COLS);
          const col = i % COLS;

          const cb = document.createElement("input");
          cb.type = "checkbox";
          cb.id = `cb-${i}`;
          cb.checked = state[i];
          cb.style.cssText = `
      position: absolute;
      top:  ${row * ROW_HEIGHT + 16}px;
      left: ${col * CB_FULL + 16}px;
      width:  ${CB_SIZE}px;
      height: ${CB_SIZE}px;
      margin: 0;
    `;

          if (isLoggedIn) {
            cb.addEventListener("change", (e) => {
              if (isRateLimited) {
                e.target.checked = state[i];
                return;
              }
              const newChecked = e.target.checked;
              e.target.checked = state[i];
              socket.emit("client:checkbox:change", {
                index: i,
                checked: newChecked,
              });
            });
          } else {
            cb.disabled = true;
            cb.style.cursor = "not-allowed";
            cb.style.opacity = "0.5";
          }

          inner.appendChild(cb);
          visible.set(i, cb);
        }
      }

      container.addEventListener("scroll", () => requestAnimationFrame(render));
      window.addEventListener("resize", () => {
        recalcCols();
        render();
      });


      async function handleOAuthRedirect() {
        const params = new URLSearchParams(window.location.search);
        const code = params.get("code");
        if (!code) return false;
        window.history.replaceState(
          {},
          document.title,
          window.location.pathname,
        );
        try {
          const res = await fetch("/api/auth/callback", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            credentials: "include",
            body: JSON.stringify({ code }),
          });
          return res.ok;
        } catch {
          return false;
        }
      }

      async function checkAuth() {
        const res = await fetch("/api/auth/me", { credentials: "include" });
        if (!res.ok) return null;
        const { user } = await res.json();
        return user;
      }

      function showLoggedIn(user) {
        const loginBtn = document.getElementById("btn-login");
        loginBtn.outerHTML = `
    <div style="display:flex;align-items:center;gap:10px;">
      <span style="color:rgba(255,255,255,0.7);font-size:0.85rem;font-weight:500;">
        👤 ${user.name ?? user.email ?? "User"}
      </span>
      <button id="btn-logout" style="
        padding:8px 20px;border-radius:10px;
        border:1px solid rgba(248,113,113,0.3);
        font-size:0.85rem;font-weight:600;
        background:rgba(248,113,113,0.15);
        color:#f87171;cursor:pointer;
      ">Logout</button>
    </div>
  `;
        document
          .getElementById("btn-logout")
          .addEventListener("click", async () => {
            await fetch("/api/auth/logout", {
              method: "POST",
              credentials: "include",
            });
            window.location.reload();
          });
      }


      socket.on("server:error", ({ error }) => {
        error.toLowerCase().includes("wait")
          ? showRateLimitError()
          : showGeneralError(error);
      });

      function showRateLimitError() {
        if (isRateLimited) return;
        isRateLimited = true;

        const errorAlert = document.getElementById("error-alert");
        let t = 5;
        errorAlert.innerHTML = `
    <div class="error-message">⏱️ Rate Limited</div>
    <div class="countdown">Please wait ${t}s before next action</div>
  `;
        errorAlert.classList.add("show");

        const iv = setInterval(() => {
          t--;
          if (t > 0) {
            errorAlert.querySelector(".countdown").textContent =
              `Please wait ${t}s before next action`;
          } else {
            clearInterval(iv);
            isRateLimited = false;
            errorAlert.classList.remove("show");
          }
        }, 1000);
      }

      function showGeneralError(message) {
        const errorAlert = document.getElementById("error-alert");
        errorAlert.innerHTML = `
    <div class="error-message">⚠️ Error</div>
    <div class="countdown">${message}</div>
  `;
        errorAlert.classList.add("show");
        setTimeout(() => errorAlert.classList.remove("show"), 4000);
      }


      socket.on("server:checkbox:change", ({ index, checked }) => {
        state[index] = checked;
        const el = visible.get(index);
        if (el) el.checked = checked;
      });

      socket.on("server:checkbox:revert", ({ index, checked }) => {
        state[index] = checked;
        const el = visible.get(index);
        if (el) el.checked = checked;
      });


      window.addEventListener("load", async () => {
        await handleOAuthRedirect();

        const user = await checkAuth();
        if (user) {
          isLoggedIn = true;
          showLoggedIn(user);
        }

        const res = await fetch("/checkboxes");
        const data = await res.json();
        if (data?.checkboxes) state = data.checkboxes;

        recalcCols();
        render();
      });
    </script>
  </body>
</html>
